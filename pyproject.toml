[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shhcsrp-simpy"
version = "0.1.0"
description = "Event-driven stochastic home health-care routing and scheduling simulator, Gymnasium and ACO demo"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<3",
  "openpyxl>=3.1,<4",
  "simpy>=4.1,<5",
  "gymnasium>=1.0,<2",
  "plotly>=5.18,<7",
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.3,<4", "sb3-contrib>=2.3,<4", "optuna>=3.5,<5", "torch>=2.1"]
test = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
shhcsrp-demo = "shhcsrp_simpy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shhcsrp_simpy = ["datasets/*.xlsx", "datasets/*.csv"]

[tool.ruff]
line-length = 100

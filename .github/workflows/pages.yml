name: Publish benchmark report

on:
  push:
    branches: ['**']
    paths:
      - 'docs/report/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out report
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check site entry points
        run: |
          test -s docs/report/index.html
          test -s docs/report/results.html
          test -s docs/report/setup/index.html
          test -s docs/report/development/index.html
          test -s docs/report/simulator/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload report
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/report
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
